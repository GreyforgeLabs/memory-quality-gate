name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish. Use a release tag such as v0.2.0."
        required: true
        default: "v0.2.0"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memory-quality-gate
    steps:
      - name: Validate publish ref format
        env:
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          if ! printf '%s' "$PUBLISH_REF" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::Publish ref must be a release tag like v0.1.0"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate publish tag matches project version
        env:
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${PUBLISH_REF}^{commit}" >/dev/null; then
            echo "::error::Publish ref $PUBLISH_REF is not a local release tag"
            exit 1
          fi

          TAG_SHA="$(git rev-parse "refs/tags/${PUBLISH_REF}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Checked out HEAD does not match tag $PUBLISH_REF"
            exit 1
          fi

          TAG_VERSION="${PUBLISH_REF#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["project"]["version"])
          PY
          )"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match project.version $PROJECT_VERSION"
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
